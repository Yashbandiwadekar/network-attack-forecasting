<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Phoenix IDPS">
  <!-- Matches the in-app brand mark: the ShieldAlert icon in the accent orange (#ff6a00).
       Drawn as a filled shield rather than the stroked lucide original, because a 1.5px stroke
       disappears at the 16x16 the browser actually renders a tab favicon at. The dark rounded
       plate keeps the orange legible on both light and dark browser chrome. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <path d="M16 4.2 26 8.1v8.2c0 6.1-4.6 9.9-10 11.7-5.4-1.8-10-5.6-10-11.7V8.1z" fill="#ff6a00"/>
  <rect x="14.8" y="10.4" width="2.4" height="7.4" rx="1.2" fill="#0a0a0a"/>
  <circle cx="16" cy="21.2" r="1.5" fill="#0a0a0a"/>
</svg>
