# NOT a standalone result config any more (audit H7/W20, 2026-09-29) -- for a v2 checkpoint result,
# use configs/real_data_v2_converged.yaml instead. This file is STILL a live dependency of
# eval/lofo.py (BASE_CONFIG), which overrides only paths.processed_dir/checkpoint_dir per LOFO
# fold, so do not delete it -- the checkpoints_real_v2_lofo/ results depend on the split and
# hyperparameters below exactly as written.
#
# It no longer reproduces either standalone v2 checkpoint, though: checkpoints_real_v2/ was
# trained at batch_size 64, 15 epochs (confirmed: train_v2.log has exactly 15 "epoch" lines) with
# the split below (val/test include the fabricated 04-01/04-02 benign days). This file's
# batch_size/epochs were edited to 64/30 by a later commit to match the W7 retrain, but its split
# section was not updated to match -- it still includes the fabricated April days that
# real_data_v2_converged.yaml deliberately drops (see that file's own header). So today this file
# matches NEITHER standalone checkpoint: not checkpoints_real_v2 (wrong epoch count) and not
# checkpoints_real_v2_converged (wrong split). checkpoints_real_v2/ itself is left untouched
# (protected artefact, do not touch without asking) and stays on disk as a superseded,
# non-reproducible-by-any-current-config result -- docs/04-evaluation-real-v2.md already
# documents it as superseded by the converged run.
#
# Original header, kept for context:
# Day-disjoint variant of configs/real_data.yaml (audit E1, E8). Writes to *_v2 paths so the
# original processed data, checkpoints and reports are never touched.
# Same windowing/features/model/split/mitre_stages as configs/default.yaml — only the paths
# differ, so the synthetic (fast, for dev/tests/demo default) and real (slow, for submission-grade
# results) pipelines never clobber each other's data, checkpoints, or eval reports. Keep every
# section below configs/paths in sync with configs/default.yaml by hand; there's no dataset-level
# reason for them to diverge, only the raw-data source does.
#
# Real CIC-IDS-2018 has no PCAP downloaded (37 GB/day, not worth it — see
# docs/02-dataset-and-features.md), so this runs entirely in flow-only mode: all packet_level
# features zero-fill, and `reconnaissance` will have zero training examples as a direct
# consequence (its heuristic needs port_scan_score, a packet-level feature) — expected, documented
# in docs/03-mitre-mapping.md, not a bug.
#
# 9 of the 10 downloaded days strip Src IP/Dst IP/Src Port entirely (a real CIC-IDS-2018 "ML-ready"
# CSV quirk); windowing falls back to one pseudo-host per calendar day for those
# ("NETWORK-<date>", see pipeline/flow_features.py::_fill_missing_ip_columns), so the trained model
# sees a mix of genuine per-host sequences (Tuesday-20-02-2018, the one day with real IPs) and
# network-wide daily aggregates (everything else) — has_ip_data flags which is which.

paths:
  raw_flow_dir: data/raw/flows_real
  raw_pcap_dir: data/raw/pcap_real      # intentionally empty — see note above
  processed_dir: data/processed_real_v2
  checkpoint_dir: checkpoints_real_v2
  eval_report: docs/04-evaluation-real-v2.md

windowing:
  window_seconds: 10
  sequence_length: 12
  forecast_horizon: 6
  group_by: src_ip                      # see configs/default.yaml's comment on this key
  recon_port_scan_threshold: 0.5

features:
  flow_level:
    - flow_count
    - unique_dst_ports
    - unique_dst_ips
    - has_ip_data
    - total_bytes
    - total_packets
    - mean_duration
    - syn_ratio
    - ack_ratio
    - fin_ratio
    - rst_ratio
    - psh_ratio
    - urg_ratio
    - mean_iat
    - var_iat
    - max_iat
    - bidir_ratio
    - tcp_ratio
    - udp_ratio
  graph_level:
    - graph_out_degree
    - graph_fan_out_ratio
    - graph_fan_in_ratio
    - graph_component_size
    - graph_dst_entropy
  graph_embedding:                    # learned per-window host embedding (models/graph_encoder.py); see pipeline/graph_embedding_features.py for scope caveat (frozen random-init encoder)
    - graph_embed_0
    - graph_embed_1
    - graph_embed_2
    - graph_embed_3
    - graph_embed_4
    - graph_embed_5
    - graph_embed_6
    - graph_embed_7
  packet_level:
    - mean_ttl
    - var_ttl
    - mean_window_size
    - frag_ratio
    - mean_payload_size
    - std_payload_size
    - port_scan_score
    - retransmit_ratio
    - has_packet_features

split:
  # Day-disjoint split (audit E1/E8): no attack session is shared between train, val and test.
  # Families by day (from the labels): initial_access 02-14, 02-22, 02-23; DoS/DDoS (impact)
  # 02-15, 02-16, 02-20, 02-21; lateral_movement 02-28, 03-01; command_and_control 03-02 only;
  # benign-only 04-01, 04-02. C2 has one day, so it stays in train here and is held out only in
  # the leave-one-family-out runs.
  mode: by_day
  train_days: ["02-14", "02-20", "02-21", "02-28", "03-02"]
  val_days: ["02-15", "02-22", "04-01"]
  test_days: ["02-16", "02-23", "03-01", "04-02"]

model:
  d_model: 64
  n_heads: 4
  n_layers: 3
  d_ff: 128
  dropout: 0.1
  batch_size: 64
  lr: 0.0003
  epochs: 30
  device: cuda

mitre_stages:
  - benign
  - reconnaissance
  - initial_access
  - lateral_movement
  - command_and_control
  - exfiltration

baseline:
  model: logistic_regression
  max_iter: 1000
