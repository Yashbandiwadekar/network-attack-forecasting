# Same windowing/features/model/split/mitre_stages as configs/default.yaml — only the paths
# differ, so the synthetic (fast, for dev/tests/demo default) and real (slow, for submission-grade
# results) pipelines never clobber each other's data, checkpoints, or eval reports. Keep every
# section below configs/paths in sync with configs/default.yaml by hand; there's no dataset-level
# reason for them to diverge, only the raw-data source does.
#
# Real CIC-IDS-2018 has no PCAP downloaded (37 GB/day, not worth it — see
# docs/02-dataset-and-features.md), so this runs entirely in flow-only mode: all packet_level
# features zero-fill, and `reconnaissance` will have zero training examples as a direct
# consequence (its heuristic needs port_scan_score, a packet-level feature) — expected, documented
# in docs/03-mitre-mapping.md, not a bug.
#
# 9 of the 10 downloaded days strip Src IP/Dst IP/Src Port entirely (a real CIC-IDS-2018 "ML-ready"
# CSV quirk); windowing falls back to one pseudo-host per calendar day for those
# ("NETWORK-<date>", see pipeline/flow_features.py::_fill_missing_ip_columns), so the trained model
# sees a mix of genuine per-host sequences (Tuesday-20-02-2018, the one day with real IPs) and
# network-wide daily aggregates (everything else) — has_ip_data flags which is which.

paths:
  raw_flow_dir: data/raw/flows_real
  raw_pcap_dir: data/raw/pcap_real      # intentionally empty — see note above
  processed_dir: data/processed_real
  checkpoint_dir: checkpoints_real
  eval_report: docs/04-evaluation-real.md

windowing:
  window_seconds: 10
  sequence_length: 12
  forecast_horizon: 6
  group_by: src_ip                      # see configs/default.yaml's comment on this key
  recon_port_scan_threshold: 0.5

features:
  flow_level:
    - flow_count
    - unique_dst_ports
    - unique_dst_ips
    - has_ip_data
    - total_bytes
    - total_packets
    - mean_duration
    - syn_ratio
    - ack_ratio
    - fin_ratio
    - rst_ratio
    - psh_ratio
    - urg_ratio
    - mean_iat
    - var_iat
    - max_iat
    - bidir_ratio
    - tcp_ratio
    - udp_ratio
  graph_level:
    - graph_out_degree
    - graph_fan_out_ratio
    - graph_fan_in_ratio
    - graph_component_size
    - graph_dst_entropy
  graph_embedding:                    # learned per-window host embedding (models/graph_encoder.py); see pipeline/graph_embedding_features.py for scope caveat (frozen random-init encoder)
    - graph_embed_0
    - graph_embed_1
    - graph_embed_2
    - graph_embed_3
    - graph_embed_4
    - graph_embed_5
    - graph_embed_6
    - graph_embed_7
  packet_level:
    - mean_ttl
    - var_ttl
    - mean_window_size
    - frag_ratio
    - mean_payload_size
    - std_payload_size
    - port_scan_score
    - retransmit_ratio
    - has_packet_features

split:
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  chronological: true

model:
  d_model: 64
  n_heads: 4
  n_layers: 3
  d_ff: 128
  dropout: 0.1
  batch_size: 64
  lr: 0.0003
  epochs: 30
  device: cuda

mitre_stages:
  - benign
  - reconnaissance
  - initial_access
  - lateral_movement
  - command_and_control
  - exfiltration

baseline:
  model: logistic_regression
  max_iter: 1000
