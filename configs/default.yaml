# Single source of truth for paths, windowing, and model hyperparameters.
# Every script (pipeline, training, forecasting, eval, demo) reads this file.

paths:
  raw_flow_dir: data/raw/flows          # CICFlowMeter CSVs
  raw_pcap_dir: data/raw/pcap           # raw PCAP files (optional, packet-level features)
  processed_dir: data/processed/cicids2018/splits
  checkpoint_dir: checkpoints
  eval_report: docs/04-evaluation.md

windowing:
  window_seconds: 10                    # time-window size for state aggregation
  sequence_length: 12                   # L past windows fed to the model (2 min of context at 10s windows)
  forecast_horizon: 6                   # K steps rolled out ahead (1 min lookahead at 10s windows)
  group_by: src_ip                      # windowing always groups by src_ip; when a data source has no
                                         # real IPs, flow_features.py substitutes one pseudo-host per
                                         # calendar day, which makes this network-wide instead of per-host
                                         # for that data — see _fill_missing_ip_columns and has_ip_data
  recon_port_scan_threshold: 0.5        # benign window with port_scan_score above this, followed by
                                         # an attack within forecast_horizon windows, is relabeled reconnaissance

# Ordered feature vector — this exact order is what flow_features.py / packet_features.py /
# windowing.py must emit and what world_model.py consumes. Keep in sync with docs/02-dataset-and-features.md.
features:
  flow_level:
    - flow_count
    - unique_dst_ports
    - unique_dst_ips
    - has_ip_data                    # 1.0 if this window's flows had a real source IP, 0.0 if
                                      # src_ip/dst_ip were unavailable and windowing fell back to a
                                      # per-day network-wide pseudo-host (see flow_features.py);
                                      # explains why unique_dst_ips reads 0 rather than "unknown"
    - total_bytes
    - total_packets
    - mean_duration
    - syn_ratio
    - ack_ratio
    - fin_ratio
    - rst_ratio
    - psh_ratio
    - urg_ratio
    - mean_iat
    - var_iat
    - max_iat
    - bidir_ratio
    - tcp_ratio
    - udp_ratio
  graph_level:                        # per-window host-interaction graph features
    - graph_out_degree               # unique destination IPs contacted this window
    - graph_fan_out_ratio            # out_degree / flow_count — spread per flow
    - graph_fan_in_ratio             # avg sources-to-my-dsts / flow_count — sharing signal
    - graph_component_size           # nodes in this host's connected component
    - graph_dst_entropy              # Shannon entropy of dst_ip distribution
  graph_embedding:                    # learned per-window host embedding (models/graph_encoder.py); see pipeline/graph_embedding_features.py for scope caveat (frozen random-init encoder)
    - graph_embed_0
    - graph_embed_1
    - graph_embed_2
    - graph_embed_3
    - graph_embed_4
    - graph_embed_5
    - graph_embed_6
    - graph_embed_7
  packet_level:
    - mean_ttl
    - var_ttl
    - mean_window_size
    - frag_ratio
    - mean_payload_size
    - std_payload_size
    - port_scan_score
    - retransmit_ratio
    - has_packet_features           # 1.0 if a PCAP covered this window, 0.0 if packet features are zero-filled —
                                     # lets the model distinguish "no scan activity" from "no packet data at all"

split:
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  chronological: true                   # never shuffle across time — this is a forecasting task

model:
  d_model: 64
  n_heads: 4
  n_layers: 3
  d_ff: 128
  dropout: 0.1
  batch_size: 64
  lr: 0.0003
  epochs: 30
  device: cuda                          # falls back to cpu automatically if unavailable

mitre_stages:
  - benign
  - reconnaissance
  - initial_access
  - lateral_movement
  - command_and_control
  - exfiltration

baseline:
  model: logistic_regression
  max_iter: 1000
